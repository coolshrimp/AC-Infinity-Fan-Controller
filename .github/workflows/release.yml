name: Build and release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate version and publish
        shell: pwsh
        run: |
          [xml]$project = Get-Content ACInfinityDesktop.csproj
          $version = $project.Project.PropertyGroup.Version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw 'The version tag must match the project version.'
          }
          ./publish.ps1
      - name: Run offline and window checks
        shell: pwsh
        run: ./verify.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: Releases/dotnet-*/AC-Infinity-Desktop.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: release
      - name: Publish single executable
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $files = @(Get-ChildItem release -Recurse -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne 'AC-Infinity-Desktop.exe') {
            throw 'Expected exactly one executable release asset.'
          }
          gh release create $env:GITHUB_REF_NAME $files[0].FullName --verify-tag --title "AC Infinity Desktop $env:GITHUB_REF_NAME" --notes-file .github/RELEASE_POST.md
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed.' }
